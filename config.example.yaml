# Copy this file to the path you mount or pass to --config. Edit redis.addresses
# in the copy. This repository tracks config.example.yaml only.
#
# Precedence for a setting that has a flag is an explicit flag, then the MCP_
# environment variable, then this file, then the built-in default. Omitting the
# flag does not erase the file. The tools command does not bind port, listen,
# log_level, or sse_base_url.
#
# The password is only MCP_REDIS_PASSWORD. A password field in this file is ignored.
#
# Field environment names:
# MCP_PORT, MCP_LISTEN, MCP_SSE_BASE_URL, MCP_LOG_LEVEL,
# MCP_ENABLED_TOOLS, MCP_DISABLED_TOOLS, MCP_ENABLED_DOMAINS, MCP_DISABLED_DOMAINS,
# MCP_ALLOW_UNSAFE_DATABASE_ROLE, MCP_REDIS_TOPOLOGY, MCP_REDIS_ADDRESSES,
# MCP_REDIS_USERNAME, MCP_REDIS_TLS, MCP_REDIS_SENTINEL_MASTER,
# MCP_REDIS_WRITE_ENABLED.
# List values are split on commas, then each item is trimmed. A space does not
# split an item. MCP_REDIS_ADDRESSES=127.0.0.1:6379, 10.0.0.2:6379 is two
# addresses. MCP_ENABLED_TOOLS=redis_string redis_hash is one name.
# MCP_MASKING_JSON, when set, replaces the masking object. An empty value is rejected.
# When that variable is unset, the object in this file is used.

port: 0
listen: 127.0.0.1
sse_base_url: ""
log_level: info
enabled_tools: []
disabled_tools: []
enabled_domains: []
disabled_domains: []
# Skip only the startup rejection of an unsafe Redis role. Connection and ACL
# probe failures still stop startup. Also MCP_ALLOW_UNSAFE_DATABASE_ROLE.
allow_unsafe_database_role: false
# Output masking stays off unless enabled is true and at least one rule is set.
# MCP_MASKING_JSON, when present, replaces this object. An empty value is rejected.
# masking:
#   enabled: true
#   placeholder: "[masked]"
#   names: ["synthetic_field"]
#   name_patterns: ["token_.+"]
#   values: ["synthetic-token-value"]
#   value_patterns: ["sk_live_[0-9]+"]
redis:
  topology: standalone
  addresses: ["127.0.0.1:6379"]
  username: ""
  tls: false
  sentinel_master: ""
  write_enabled: false
